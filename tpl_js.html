<script>
const D = __PAYLOAD__;
const T = __THEMES__;
const COL = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)'];
const DOMAINS = ['Belonging','Consistency','Coherence'];
const DCOL = {Belonging:'var(--coral)',Consistency:'var(--green)',Coherence:'var(--navy)'};
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- helpers ---------- */
function pooled(st){ const c=[0,0,0,0]; st.forEach(s=>s.counts.forEach((v,i)=>c[i]+=v)); return c; }
function avgOf(c){ const n=c.reduce((a,b)=>a+b,0); return n? c.reduce((a,b,i)=>a+b*(i+1),0)/n : null; }
function domStats(st,dom){ return st.filter((_,i)=>D.inds[i].domain===dom); }
function barHTML(counts,n,showLabels){
  return counts.map((v,i)=> v===0 ? '' :
    `<div style="width:${(v/n*100).toFixed(3)}%;background:${COL[i]}" title="${D.scale[i]}: ${v} of ${n} (${Math.round(v/n*100)}%)">`
    + (showLabels && v/n>0.09 ? `<span>${v}</span>` : '') + '</div>').join('');
}
function legendHTML(){ return D.scale.map((s,i)=>`<span><i style="background:${COL[i]}"></i>${s}</span>`).join(''); }

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); document.getElementById('p-'+b.dataset.p).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
});
['legend1','legend2','legend3'].forEach(id=>document.getElementById(id).innerHTML=legendHTML());

/* ---------- overview ---------- */
const ALL = D.stats.All;
const totalCounts = pooled(ALL), totalN = totalCounts.reduce((a,b)=>a+b,0);
document.getElementById('mN').textContent = D.counts.All;
document.getElementById('mR').textContent = totalN;
document.getElementById('mO').textContent = T.well.answered + T.next.answered + T.support.answered;
document.getElementById('totalBar').innerHTML = barHTML(totalCounts,totalN,true);

const DESC = {
 Belonging:'Structures that build collective knowledge of students, specialist collaboration, and clear growth goals.',
 Consistency:'Grade-level work for all, curriculum use, team commitments, named practices, and non-evaluative walkthroughs.',
 Coherence:'Aligned learning spaces, intervention materials matched to core, and focused schoolwide goals.'
};
document.getElementById('domainCards').innerHTML = DOMAINS.map(d=>{
  const st = domStats(ALL,d), c = pooled(st), a = avgOf(c);
  return `<div class="card pad dcard ${d}">
    <h3>${d}</h3>
    <div style="font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-family:var(--head)">${st.length} indicators &middot; ${c.reduce((x,y)=>x+y,0)} ratings</div>
    <div class="sc">${a.toFixed(2)}<span> / 4.00</span></div>
    <div class="track"><i style="width:${((a-1)/3*100).toFixed(1)}%;background:${DCOL[d]}"></i></div>
    <p>${DESC[d]}</p></div>`;
}).join('');

/* findings computed live from the data */
const idx = ALL.map((s,i)=>({...s,...D.inds[i],i}));
const sorted = [...idx].sort((a,b)=>b.avg-a.avg);
const hi = sorted[0], lo = sorted[sorted.length-1];
const someModal = idx.filter(s=>s.counts[1]===Math.max(...s.counts)).length;
const lowShare = totalCounts[0]+totalCounts[1];
const zeroAlways = idx.filter(s=>s.counts[3]===0);
const gl = idx.find(s=>s.text.startsWith('Every student works on grade-level'));
const cohPair = idx.filter(s=>s.domain==='Coherence' && s!==hi);
const cohPairAvg = avgOf(pooled(cohPair));
const overallAvg = avgOf(totalCounts);
const cohAvg = avgOf(pooled(domStats(ALL,'Coherence')));

const FIND = [
 ['The baseline reads as emerging, not established.',
  `<b>${lowShare} of ${totalN} ratings (${Math.round(lowShare/totalN*100)}%)</b> landed at "Never" or "Sometimes," and "Sometimes" was the single most common answer on <b>${someModal} of the 11 indicators</b>. No domain averaged above ${cohAvg.toFixed(2)} out of 4.00. Leaders are describing conditions that exist in places rather than practices that hold everywhere.`],
 ['Leaders set goals; the goals are not about grade level.',
  `The highest-rated indicator in the entire assessment is <b>"${esc(hi.text.replace(/\.$/,""))}" (${hi.avg.toFixed(2)})</b>. The lowest is <b>"${esc(lo.text.replace(/\.$/,""))}" (${lo.avg.toFixed(2)})</b>. The habit of narrowing to a few schoolwide priorities is the strongest muscle in the system &mdash; but those priorities are not currently expressed as grade-level growth targets.`],
 ['The most unanimous judgment is about grade-level work.',
  `On "${esc(gl.text.replace(/\.$/,""))}," <b>${gl.counts[1]} of ${gl.n} leaders chose "Sometimes"</b> &mdash; and not one selected "Always" or "Never." This is the tightest consensus anywhere in the assessment, and it points at the core Opportunity Myth finding: access to grade-appropriate work is the constraint, not effort or intent.`],
 ['Coherence looks strongest on paper and weakest in practice.',
  `Coherence carries the highest domain average (<b>${cohAvg.toFixed(2)}</b>), but that is driven almost entirely by the goal-setting indicator. The two coherence items about aligning instruction across settings average <b>${cohPairAvg.toFixed(2)}</b>, below the assessment-wide average of ${overallAvg.toFixed(2)}. Coherence is also the theme leaders name most often when asked what to focus on next year.`],
 ['Four indicators drew no "Always" ratings at all.',
  `Not a single leader marked "Always" on: ${zeroAlways.map(s=>'<b>'+esc(s.text.replace(/\.$/,''))+'</b>').join('; ')}. These four cluster tightly around what students who are behind actually receive.`]
];
document.getElementById('findings').innerHTML = FIND.map((f,i)=>
 `<div class="finding"><div class="num">${i+1}</div><div><h4>${f[0]}</h4><p>${f[1]}</p></div></div>`).join('');

/* ---------- baseline panel ---------- */
let curLevel='All', curSort='domain';
const levelOpts = ['All',...D.levels];
function segHTML(sel){ return levelOpts.map(L=>`<button data-l="${L}" class="${L===sel?'on':''}">${L==='All'?'All leaders':L} (${D.counts[L]})</button>`).join(''); }
function renderBars(){
  const st = D.stats[curLevel];
  const rows = st.map((s,i)=>({...s,...D.inds[i]})).filter(s=>s.n>0);
  let html='';
  if(curSort==='domain'){
    DOMAINS.forEach(d=>{
      const g = rows.filter(r=>r.domain===d); if(!g.length) return;
      const a = avgOf(pooled(g));
      html += `<div class="dgroup"><h3>${d}<em>domain average ${a.toFixed(2)} &middot; ${g.length} indicator${g.length>1?'s':''}</em></h3>` + g.map(rowHTML).join('') + '</div>';
    });
  } else {
    const g=[...rows].sort((a,b)=> curSort==='desc'? b.avg-a.avg : a.avg-b.avg);
    html = `<div class="dgroup"><h3>${curSort==='desc'?'Highest rated first':'Lowest rated first'}<em>${g.length} indicators &middot; ${curLevel==='All'?'all leaders':curLevel}</em></h3>` + g.map(rowHTML).join('') + '</div>';
  }
  document.getElementById('bars').innerHTML = html;
  const n = D.counts[curLevel];
  document.getElementById('levelNote').innerHTML = curLevel==='All' ? '' :
   `<div class="note"><b>Small group.</b> This view shows ${n} respondent${n>1?'s':''}. With a group this size a single answer shifts a bar by ${Math.round(100/n)} percentage points, so read these as directional signals, not as differences between levels.</div>`;
}
function rowHTML(s){
  return `<div class="row">
   <div class="lab">${esc(s.text)}<small>${s.domain} &middot; ${s.n} response${s.n>1?'s':''}</small></div>
   <div class="bar">${barHTML(s.counts,s.n,true)}</div>
   <div class="avg">${s.avg.toFixed(2)}<small>avg / 4</small></div></div>`;
}
document.getElementById('levelSeg').innerHTML = segHTML('All');
document.getElementById('levelSeg').onclick = e=>{ if(!e.target.dataset.l) return;
  curLevel=e.target.dataset.l;
  document.querySelectorAll('#levelSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===curLevel));
  renderBars(); };
document.getElementById('sortSeg').onclick = e=>{ if(!e.target.dataset.s) return;
  curSort=e.target.dataset.s;
  document.querySelectorAll('#sortSeg button').forEach(b=>b.classList.toggle('on',b.dataset.s===curSort));
  renderBars(); };
renderBars();

/* ---------- themes ---------- */
const QKEY = {well:'Doing well',next:'Focus next year',support:'Support needed'};
document.getElementById('themeBlocks').innerHTML = ['well','next','support'].map(k=>{
  const b = T[k];
  return `<div style="margin-bottom:34px">
   <div class="tq"><h3>${esc(b.q)}</h3><p>${b.answered} of ${D.counts.All} leaders responded${b.blank?` &middot; ${b.blank} left blank`:''}</p></div>
   <div class="tbody">${b.themes.map(t=>`
     <div class="theme"><div class="th">
       <span class="pill">${t.n} of ${D.counts.All}</span>
       <div><h4>${esc(t.t)}</h4><p class="desc">${esc(t.d)}</p></div>
       <span class="chev">Quotes +</span></div>
       <div class="quotes">${t.q.map(q=>`<blockquote>${esc(q[2])}<cite>${lvlOf(q[0])} &middot; ${QKEY[q[1]]}</cite></blockquote>`).join('')}</div>
     </div>`).join('')}</div></div>`;
}).join('');
function lvlOf(id){ return D.resp.find(r=>r.id===id).level; }
document.querySelectorAll('.theme .th').forEach(h=>h.onclick=()=>{
  const t=h.parentElement; t.classList.toggle('open');
  h.querySelector('.chev').textContent = t.classList.contains('open')?'Quotes −':'Quotes +';
});

/* ---------- responses ---------- */
let curLevel2='All', curQ='';
document.getElementById('levelSeg2').innerHTML = segHTML('All');
document.getElementById('levelSeg2').onclick = e=>{ if(!e.target.dataset.l) return;
  curLevel2=e.target.dataset.l;
  document.querySelectorAll('#levelSeg2 button').forEach(b=>b.classList.toggle('on',b.dataset.l===curLevel2));
  renderResp(); };
document.getElementById('q').oninput = e=>{ curQ=e.target.value.toLowerCase().trim(); renderResp(); };
function renderResp(){
  const list = D.resp.filter(r=> (curLevel2==='All'||r.level===curLevel2) &&
    (!curQ || (r.well+' '+r.next+' '+r.support).toLowerCase().includes(curQ)));
  document.getElementById('noHits').classList.toggle('hidden', list.length>0);
  document.getElementById('respList').innerHTML = list.map(r=>`
   <div class="card rcard"><div class="rhead">
     <span class="chip">${r.level}</span><span class="rid">Respondent ${r.id}</span>
     <span class="mini" title="Ratings in indicator order">${r.r.map((v,i)=>
       `<i style="background:${v?COL[D.scale.indexOf(v)]:'#DDE2E6'}" title="${esc(D.inds[i].text)} — ${v||'no answer'}"></i>`).join('')}</span>
   </div>
   ${[['well','What we are doing well'],['next','What to focus on next year'],['support','Support wanted or needed']].map(([k,lab])=>
     `<div class="qa"><div class="k">${lab}</div><div class="v${r[k]?'':' empty'}">${r[k]?esc(r[k]):'No response'}</div></div>`).join('')}
   </div>`).join('');
}
renderResp();
</script></body></html>
