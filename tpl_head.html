<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leader Feedback on Opportunity Makers Readiness</title>
<style>
:root{
 --navy:#00355F; --pale:#E2EDDC; --yellow:#F2CF13; --green:#3F8A6A;
 --crimson:#C21943; --coral:#F26C4C; --gray:#4A4A4A; --link:#346F55;
 --ink:#12181F; --muted:#5C6670; --line:#D8DEE3; --bg:#F4F6F7; --card:#FFFFFF;
 --s1:var(--crimson); --s2:var(--coral); --s3:var(--green); --s4:var(--navy);
 --head:"Franklin Gothic Heavy","Arial Black","Helvetica Neue",Arial,sans-serif;
 --body:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
h1,h2,h3,h4{font-family:var(--head);font-weight:900;letter-spacing:-.01em;margin:0}
a{color:var(--link)}

/* ---------- header ---------- */
header{background:var(--navy);color:#fff;padding:52px 0 40px;position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:var(--yellow)}
.eyebrow{font-family:var(--head);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);margin-bottom:14px}
header h1{font-size:clamp(30px,4.6vw,50px);line-height:1.04;max-width:20ch}
header p.sub{margin:18px 0 0;max-width:64ch;color:#C6D6E4;font-size:16px}
.metastrip{display:flex;flex-wrap:wrap;gap:26px;margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.22)}
.metastrip div{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9FB6CA}
.metastrip b{display:block;font-family:var(--head);font-size:26px;letter-spacing:0;text-transform:none;color:#fff;line-height:1.1}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.03)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;font-family:var(--head);font-size:13px;letter-spacing:.06em;text-transform:uppercase;
 color:var(--muted);padding:18px 16px;cursor:pointer;border-bottom:4px solid transparent;white-space:nowrap}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--yellow)}
main{padding:40px 0 90px}
.panel{display:none}.panel.on{display:block}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:3px}
.pad{padding:26px 28px}
.sec-h{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-family:var(--head);margin:0 0 14px}
.rule{height:4px;width:52px;background:var(--yellow);margin:0 0 18px}
h2.big{font-size:27px;margin-bottom:8px;color:var(--navy)}
p.lede{color:var(--muted);max-width:78ch;margin:0 0 24px}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}

/* ---------- domain cards ---------- */
.dcard{position:relative;overflow:hidden}
.dcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}
.dcard.Belonging:before{background:var(--coral)}
.dcard.Consistency:before{background:var(--green)}
.dcard.Coherence:before{background:var(--navy)}
.dcard h3{font-size:19px;color:var(--navy);margin-bottom:2px}
.dcard .sc{font-family:var(--head);font-size:46px;line-height:1;color:var(--navy);margin:12px 0 2px}
.dcard .sc span{font-size:16px;color:var(--muted);font-family:var(--body);font-weight:400}
.dcard p{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.track{height:9px;background:#EAEEF1;border-radius:99px;overflow:hidden;margin-top:14px}
.track i{display:block;height:100%;border-radius:99px}

/* ---------- findings ---------- */
.finding{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.finding:last-child{border-bottom:0}
.finding .num{font-family:var(--head);font-size:13px;color:#fff;background:var(--navy);width:28px;height:28px;flex:0 0 28px;
 border-radius:99px;display:grid;place-items:center;margin-top:2px}
.finding h4{font-size:16.5px;color:var(--navy);margin-bottom:5px}
.finding p{margin:0;color:var(--muted);font-size:14.5px}
.finding b{color:var(--ink)}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;margin-bottom:8px}
.ctl label{display:block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-family:var(--head);margin-bottom:7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:#fff;font-family:var(--body);font-size:13px;padding:9px 14px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:#F0F3F5}
.seg button.on{background:var(--navy);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:22px 0 26px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:2px;margin-right:7px;vertical-align:-2px}

.note{background:var(--pale);border-left:4px solid var(--green);padding:14px 18px;font-size:13.5px;color:#2C4A3B;border-radius:0 3px 3px 0}
.note b{color:var(--navy)}

/* ---------- bars ---------- */
.dgroup{margin-bottom:34px}
.dgroup > h3{font-size:15px;color:var(--navy);text-transform:uppercase;letter-spacing:.09em;padding-bottom:9px;border-bottom:2px solid var(--navy);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.dgroup > h3 em{font-style:normal;font-family:var(--body);font-size:12.5px;color:var(--muted);letter-spacing:0;text-transform:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) 320px 74px;gap:18px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lab{font-size:14px;line-height:1.4}
.row .lab small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--head)}
.bar{display:flex;height:26px;border-radius:2px;overflow:hidden;background:#EEF1F3}
.bar div{position:relative;transition:width .35s cubic-bezier(.4,0,.2,1);cursor:default}
.bar div span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:bold}
.avg{font-family:var(--head);font-size:20px;text-align:right;color:var(--navy)}
.avg small{display:block;font-family:var(--body);font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:.05em}
@media(max-width:820px){.row{grid-template-columns:1fr;gap:8px}.avg{text-align:left}}

/* ---------- themes ---------- */
.tq{background:var(--navy);color:#fff;padding:20px 24px;border-radius:3px 3px 0 0}
.tq h3{font-size:18px}
.tq p{margin:6px 0 0;color:#A9C1D4;font-size:13px}
.tbody{border:1px solid var(--line);border-top:0;background:#fff;border-radius:0 0 3px 3px;padding:6px 24px 10px}
.theme{padding:20px 0;border-bottom:1px solid var(--line)}
.theme:last-child{border-bottom:0}
.theme .th{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.pill{font-family:var(--head);font-size:12px;background:var(--pale);color:#22503C;border-radius:99px;padding:5px 11px;white-space:nowrap;flex:0 0 auto}
.theme h4{font-size:16.5px;color:var(--navy);margin-bottom:5px}
.theme .desc{margin:0;color:var(--muted);font-size:14.5px}
.chev{margin-left:auto;color:var(--muted);font-size:12px;flex:0 0 auto;padding-top:4px;font-family:var(--head);letter-spacing:.08em;text-transform:uppercase}
.quotes{display:none;margin:16px 0 0 42px}
.theme.open .quotes{display:block}
blockquote{margin:0 0 14px;border-left:3px solid var(--yellow);padding:2px 0 2px 16px;font-size:14.5px;color:#2A3540}
blockquote cite{display:block;margin-top:6px;font-style:normal;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--head)}

/* ---------- responses ---------- */
.search{width:100%;max-width:420px;padding:11px 14px;border:1px solid var(--line);border-radius:3px;font-family:var(--body);font-size:14px}
.rcard{margin-bottom:14px}
.rhead{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:#FAFBFC}
.chip{font-family:var(--head);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:5px 10px;border-radius:2px;background:var(--navy);color:#fff}
.rid{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-family:var(--head)}
.mini{margin-left:auto;display:flex;gap:3px}
.mini i{width:11px;height:20px;border-radius:1px;display:block}
.qa{padding:14px 20px;border-bottom:1px solid #EEF1F3}
.qa:last-child{border-bottom:0}
.qa .k{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-family:var(--head);margin-bottom:5px}
.qa .v{font-size:14.5px}
.qa .v.empty{color:#9AA4AD;font-style:italic}
footer{border-top:1px solid var(--line);background:#fff;padding:26px 0;font-size:12.5px;color:var(--muted)}
.hidden{display:none!important}
</style></head><body>
